name: Documentation

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'examples/**'
      - '.github/workflows/biblios-docs.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'examples/**'
      - '.github/workflows/biblios-docs.yml'

permissions:
  contents: read

jobs:
  validate-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Biblios entry points
        run: |
          test -s docs/index.adoc
          test -s docs/master.adoc
          test -s docs/biblios.yml
