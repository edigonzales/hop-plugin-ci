name: Verify Apache Hop plugin

on:
  workflow_call:
    inputs:
      java-versions:
        description: JSON array of Java versions, for example ["17"] or ["21", "25"]
        required: true
        type: string
      runner-os:
        description: JSON array of GitHub runner labels
        required: true
        type: string
      maven-working-directory:
        description: Directory containing the Maven project
        required: false
        default: .
        type: string
      maven-options:
        description: Additional Maven options before the goals
        required: false
        default: -U -B -ntp
        type: string
      maven-extra-args:
        description: Optional Maven properties and profiles
        required: false
        default: ""
        type: string
      maven-goals:
        description: Maven goals to run for the verification build
        required: false
        default: clean verify
        type: string
      pom-file:
        description: POM used to resolve the published plugin version
        required: true
        type: string
      zip-glob:
        description: Glob relative to the Maven working directory; it must match exactly one ZIP
        required: true
        type: string
      validation-commands:
        description: JSON array of shell commands run after the Maven build
        required: false
        default: "[]"
        type: string
      dependency-artifact-name:
        description: Optional artifact from an earlier job in this workflow run
        required: false
        default: ""
        type: string
      dependency-artifact-path:
        description: Destination for the optional dependency artifact
        required: false
        default: .ci/dependencies
        type: string
      artifact-name-prefix:
        description: Stable prefix used for uploaded verification artifacts
        required: true
        type: string
      group-id:
        description: Maven groupId recorded in the manifest
        required: true
        type: string
      artifact-id:
        description: Maven artifactId recorded in the manifest
        required: true
        type: string
      hop-version:
        description: Apache Hop version used by the plugin
        required: true
        type: string
      plugin-root:
        description: Required installation root inside the plugin ZIP
        required: true
        type: string
      ci-ref:
        description: Immutable branch, tag, or commit of hop-plugin-ci containing the helpers
        required: false
        default: main
        type: string
    outputs:
      artifact-name-prefix:
        description: Prefix used to name the matrix artifacts
        value: ${{ inputs.artifact-name-prefix }}

permissions:
  contents: read

jobs:
  build:
    name: Verify (${{ matrix.os }}, Java ${{ matrix.java }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.runner-os) }}
        java: ${{ fromJSON(inputs.java-versions) }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out caller repository
        uses: actions/checkout@v4

      - name: Check out CI helper scripts
        uses: actions/checkout@v4
        with:
          repository: edigonzales/hop-plugin-ci
          ref: ${{ inputs.ci-ref }}
          path: .ci/hop-plugin-ci
          persist-credentials: false

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Download dependency artifact
        if: inputs.dependency-artifact-name != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.dependency-artifact-name }}
          path: ${{ inputs.dependency-artifact-path }}

      - name: Build and run Maven verification
        working-directory: ${{ inputs.maven-working-directory }}
        env:
          MAVEN_OPTIONS: ${{ inputs.maven-options }}
          MAVEN_EXTRA_ARGS: ${{ inputs.maven-extra-args }}
          MAVEN_GOALS: ${{ inputs.maven-goals }}
        run: |
          set -euo pipefail
          # The values are workflow inputs owned by the caller repository. Splitting them
          # here preserves support for multiple Maven flags without rebuilding the project.
          read -r -a options <<< "$MAVEN_OPTIONS"
          read -r -a goals <<< "$MAVEN_GOALS"
          maven_args=("${options[@]}")
          if [[ -n "$MAVEN_EXTRA_ARGS" ]]; then
            read -r -a extra_args <<< "$MAVEN_EXTRA_ARGS"
            maven_args+=("${extra_args[@]}")
          fi
          maven_args+=("${goals[@]}")
          mvn "${maven_args[@]}"

      - name: Run distribution validation commands
        working-directory: ${{ inputs.maven-working-directory }}
        env:
          VALIDATION_COMMANDS: ${{ inputs.validation-commands }}
        run: |
          python3 "$GITHUB_WORKSPACE/.ci/hop-plugin-ci/scripts/run_commands.py" \
            --commands-json "$VALIDATION_COMMANDS"

      - name: Create verified ZIP manifest
        working-directory: ${{ inputs.maven-working-directory }}
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          GROUP_ID: ${{ inputs.group-id }}
          ARTIFACT_ID: ${{ inputs.artifact-id }}
          HOP_VERSION: ${{ inputs.hop-version }}
          PLUGIN_ROOT: ${{ inputs.plugin-root }}
          POM_FILE: ${{ inputs.pom-file }}
          ZIP_GLOB: ${{ inputs.zip-glob }}
          ARTIFACT_PREFIX: ${{ inputs.artifact-name-prefix }}
          MATRIX_OS: ${{ matrix.os }}
          MATRIX_JAVA: ${{ matrix.java }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.ci/verified"
          version="$(mvn -q -f "$POM_FILE" -DforceStdout help:evaluate -Dexpression=project.version)"
          safe_os="${MATRIX_OS//[^A-Za-z0-9._-]/-}"
          artifact_name="${ARTIFACT_PREFIX}-${safe_os}-jdk${MATRIX_JAVA}"
          python3 "$GITHUB_WORKSPACE/.ci/hop-plugin-ci/scripts/build_manifest.py" \
            --zip-glob "$ZIP_GLOB" \
            --version "$version" \
            --repository "$REPOSITORY" \
            --commit-sha "$COMMIT_SHA" \
            --group-id "$GROUP_ID" \
            --artifact-id "$ARTIFACT_ID" \
            --hop-version "$HOP_VERSION" \
            --plugin-root "$PLUGIN_ROOT" \
            --output "$GITHUB_WORKSPACE/.ci/verified/manifest.json"
          zip_path="$(python3 - "$ZIP_GLOB" <<'PY'
          from pathlib import Path
          import sys

          matches = sorted(Path.cwd().glob(sys.argv[1]))
          if len(matches) != 1:
              raise SystemExit(f"Expected exactly one ZIP for {sys.argv[1]!r}, found {len(matches)}")
          print(matches[0])
          PY
          )"
          cp "$GITHUB_WORKSPACE/.ci/verified/manifest.json" \
            "$GITHUB_WORKSPACE/.ci/verified/${artifact_name}.manifest.json"
          upload_dir="$GITHUB_WORKSPACE/.ci/verified/upload"
          rm -rf "$upload_dir"
          mkdir -p "$upload_dir"
          cp "$zip_path" "$upload_dir/$(basename "$zip_path")"
          cp "$GITHUB_WORKSPACE/.ci/verified/${artifact_name}.manifest.json" \
            "$upload_dir/${artifact_name}.manifest.json"
          echo "ARTIFACT_NAME=$artifact_name" >> "$GITHUB_ENV"

      - name: Upload verified plugin ZIP and manifest
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name-prefix }}-${{ matrix.os }}-jdk${{ matrix.java }}
          if-no-files-found: error
          path: ${{ github.workspace }}/.ci/verified/upload/*

      - name: Retain test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ inputs.artifact-name-prefix }}-${{ matrix.os }}-jdk${{ matrix.java }}
          if-no-files-found: ignore
          path: |
            ${{ inputs.maven-working-directory }}/**/target/surefire-reports/
            ${{ inputs.maven-working-directory }}/**/target/failsafe-reports/
