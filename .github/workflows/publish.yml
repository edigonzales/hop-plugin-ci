name: Publish verified Maven artifacts

on:
  workflow_call:
    inputs:
      repository-kind:
        description: snapshot or release
        required: true
        type: string
      verified-artifact-name:
        description: Artifact uploaded by verification in the same run
        required: true
        type: string
      expected-tag-prefix:
        default: v
        type: string
    secrets:
      MAVEN_USERNAME:
        required: true
      MAVEN_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  publish:
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      ((inputs['repository-kind'] == 'snapshot' && github.ref == 'refs/heads/main') ||
       (inputs['repository-kind'] == 'release' && github.ref_type == 'tag'))
    runs-on: ubuntu-latest
    steps:
      - name: Check out caller Maven configuration
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out CI helpers
        uses: actions/checkout@v4
        with:
          repository: edigonzales/hop-plugin-ci
          # Actionlint 1.7.12 does not yet know this GitHub.com job property.
          ref: ${{ fromJSON(toJSON(job)).workflow_sha || 'missing-workflow-sha' }}
          path: .ci/hop-plugin-ci
          persist-credentials: false

      - name: Download artifacts from verification
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs['verified-artifact-name'] }}
          path: .ci/publication
          digest-mismatch: error

      - name: Set up Maven credentials
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          server-id: sogeo-${{ inputs['repository-kind'] }}s
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Deploy tested files
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          KIND: ${{ inputs['repository-kind'] }}
          TAG_PREFIX: ${{ inputs['expected-tag-prefix'] }}
        run: |
          set -euo pipefail
          : "${MAVEN_USERNAME:?Maven username is missing}" "${MAVEN_PASSWORD:?Maven password is missing}"
          python3 .ci/hop-plugin-ci/scripts/publish_artifacts.py .ci/publication \
            --kind "$KIND" --git-ref "$GITHUB_REF" --tag-prefix "$TAG_PREFIX" \
            --repository-id "sogeo-${KIND}s" --url "https://jars.interlis.guru/${KIND}s/"
