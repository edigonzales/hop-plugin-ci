name: Verify Maven build

on:
  workflow_call:
    inputs:
      java-versions:
        description: JSON array of Java versions, for example ["21", "25"]
        required: true
        type: string
      runner-os:
        description: JSON array of GitHub runner labels
        required: true
        type: string
      canonical-runner-os:
        description: Runner that creates the canonical publishable artifact bundle
        required: false
        default: ubuntu-latest
        type: string
      canonical-java-version:
        description: Java version that creates the canonical publishable artifact bundle
        required: false
        default: "21"
        type: string
      maven-working-directory:
        description: Directory containing the Maven project
        required: false
        default: .
        type: string
      maven-options:
        description: Additional Maven options before the goals
        required: false
        default: -U -B -ntp
        type: string
      maven-extra-args:
        description: Optional Maven properties and profiles
        required: false
        default: ""
        type: string
      maven-goals:
        description: Maven goals to run for the verification build
        required: false
        default: clean verify
        type: string
      compatibility-goals:
        description: Maven goals for non-canonical Java/OS compatibility jobs
        required: false
        default: clean test
        type: string
      pom-file:
        description: POM used to resolve the published plugin version
        required: true
        type: string
      artifacts:
        description: JSON array of publication files and Maven POMs
        required: true
        type: string
      validation-command:
        description: Bash commands after the canonical build
        required: false
        default: ''
        type: string
      dependency-artifact-name:
        description: Optional artifact from an earlier job in this workflow run
        required: false
        default: ""
        type: string
      dependency-artifact-path:
        description: Destination for the optional dependency artifact
        required: false
        default: .ci/dependencies
        type: string
      dependency-group-id:
        description: Group ID of the JAR extracted from the dependency ZIP
        required: false
        default: ''
        type: string
      dependency-artifact-id:
        description: Artifact ID of the JAR extracted from the dependency ZIP
        required: false
        default: ''
        type: string
      dependency-version:
        description: Declared Maven version to use for the locally installed dependency JAR
        required: false
        default: ''
        type: string
      dependency-jar-glob:
        description: ZIP path glob for the dependency JAR to install
        required: false
        default: plugins/misc/hop-geometry-type/*.jar
        type: string
      artifact-name-prefix:
        description: Stable prefix used for uploaded verification artifacts
        required: true
        type: string
    outputs:
      canonical-artifact-name:
        description: Stable artifact containing the canonical ZIPs, JARs and POMs
        value: ${{ inputs['artifact-name-prefix'] }}-canonical

permissions:
  contents: read

jobs:
  validate-inputs:
    name: Validate verification contract
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      JAVA_VERSIONS: ${{ inputs['java-versions'] }}
      REQUESTED_RUNNER_OS: ${{ inputs['runner-os'] }}
      CANONICAL_JAVA: ${{ inputs['canonical-java-version'] }}
      CANONICAL_OS: ${{ inputs['canonical-runner-os'] }}
    steps:
      - name: Check canonical build is part of the requested matrix
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os

          java_versions = json.loads(os.environ["JAVA_VERSIONS"])
          runner_os = json.loads(os.environ["REQUESTED_RUNNER_OS"])
          if os.environ["CANONICAL_JAVA"] not in {str(value) for value in java_versions}:
              raise SystemExit("canonical-java-version is not present in java-versions")
          if os.environ["CANONICAL_OS"] not in runner_os:
              raise SystemExit("canonical-runner-os is not present in runner-os")

          PY

  build:
    name: Verify (${{ matrix.os }}, Java ${{ matrix.java }})
    needs: validate-inputs
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs['runner-os']) }}
        java: ${{ fromJSON(inputs['java-versions']) }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out caller repository
        uses: actions/checkout@v4

      - name: Check out CI helper scripts
        uses: actions/checkout@v4
        with:
          repository: edigonzales/hop-plugin-ci
          # Actionlint 1.7.12 does not yet know this GitHub.com job property.
          ref: ${{ fromJSON(toJSON(job)).workflow_sha || 'missing-workflow-sha' }}
          path: .ci/hop-plugin-ci
          persist-credentials: false

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Configure common Maven repositories
        id: maven-settings
        run: |
          set -euo pipefail
          settings="$RUNNER_TEMP/hop-plugin-ci-settings.xml"
          python3 "$GITHUB_WORKSPACE/.ci/hop-plugin-ci/scripts/write_maven_settings.py" \
            --output "$settings"
          echo "path=$settings" >> "$GITHUB_OUTPUT"
          maven_repo="$(python3 -c 'import os; from pathlib import Path; print((Path(os.environ.get("MAVEN_USER_HOME", Path.home() / ".m2")) / "repository").as_posix())')"
          echo "MAVEN_REPO_LOCAL=$maven_repo" >> "$GITHUB_ENV"

      - name: Download dependency artifact
        if: inputs['dependency-artifact-name'] != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs['dependency-artifact-name'] }}
          path: ${{ inputs['dependency-artifact-path'] }}

      - name: Install dependency JAR from verified ZIP
        if: inputs['dependency-artifact-name'] != '' && inputs['dependency-artifact-id'] != ''
        working-directory: ${{ inputs['maven-working-directory'] }}
        env:
          DEPENDENCY_PATH: ${{ inputs['dependency-artifact-path'] }}
          DEPENDENCY_GROUP_ID: ${{ inputs['dependency-group-id'] }}
          DEPENDENCY_ARTIFACT_ID: ${{ inputs['dependency-artifact-id'] }}
          DEPENDENCY_VERSION: ${{ inputs['dependency-version'] }}
          DEPENDENCY_JAR_GLOB: ${{ inputs['dependency-jar-glob'] }}
          MAVEN_SETTINGS: ${{ steps.maven-settings.outputs.path }}
        run: |
          set -euo pipefail
          dependency_zip="$(python3 - "$DEPENDENCY_PATH" <<'PY'
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])
          matches = sorted(root.rglob("*.zip"))
          if len(matches) != 1:
              print(f"Expected exactly one dependency ZIP, found {len(matches)}", file=sys.stderr)
              for path in sorted(root.rglob("*")):
                  if path.is_file():
                      print(path, file=sys.stderr)
              raise SystemExit(1)
          print(matches[0])
          PY
          )"
          : "${DEPENDENCY_VERSION:?Dependency Maven version is missing}"
          python3 "$GITHUB_WORKSPACE/.ci/hop-plugin-ci/scripts/install_maven_jar_from_zip.py" \
            --zip "$dependency_zip" \
            --jar-glob "$DEPENDENCY_JAR_GLOB" \
            --group-id "$DEPENDENCY_GROUP_ID" \
            --artifact-id "$DEPENDENCY_ARTIFACT_ID" \
            --version "$DEPENDENCY_VERSION" \
            --maven-settings "$MAVEN_SETTINGS" \
            --local-repository "$MAVEN_REPO_LOCAL"

      - name: Build and run Maven verification
        working-directory: ${{ inputs['maven-working-directory'] }}
        env:
          MAVEN_OPTIONS: ${{ inputs['maven-options'] }}
          MAVEN_EXTRA_ARGS: ${{ inputs['maven-extra-args'] }}
          MAVEN_GOALS: ${{ inputs['maven-goals'] }}
          COMPATIBILITY_GOALS: ${{ inputs['compatibility-goals'] }}
          MATRIX_OS: ${{ matrix.os }}
          MATRIX_JAVA: ${{ matrix.java }}
          CANONICAL_OS: ${{ inputs['canonical-runner-os'] }}
          CANONICAL_JAVA: ${{ inputs['canonical-java-version'] }}
          MAVEN_SETTINGS: ${{ steps.maven-settings.outputs.path }}
        run: |
          set -euo pipefail
          # The values are workflow inputs owned by the caller repository. Splitting them
          # here preserves support for multiple Maven flags without rebuilding the project.
          read -r -a options <<< "$MAVEN_OPTIONS"
          if [[ "$MATRIX_OS" == "$CANONICAL_OS" && "$MATRIX_JAVA" == "$CANONICAL_JAVA" ]]; then
            selected_goals="$MAVEN_GOALS"
            echo "Running canonical Maven build: $selected_goals"
          else
            selected_goals="$COMPATIBILITY_GOALS"
            echo "Running compatibility Maven build: $selected_goals"
          fi
          read -r -a goals <<< "$selected_goals"
          maven_args=("${options[@]}")
          maven_args+=("-Dmaven.repo.local=$MAVEN_REPO_LOCAL")
          if [[ -n "$MAVEN_EXTRA_ARGS" ]]; then
            read -r -a extra_args <<< "$MAVEN_EXTRA_ARGS"
            maven_args+=("${extra_args[@]}")
          fi
          maven_args+=("${goals[@]}")
          maven_args+=("-s" "$MAVEN_SETTINGS")
          if [[ "$RUNNER_OS" == "Linux" ]] && command -v xvfb-run >/dev/null 2>&1; then
            xvfb-run -a mvn "${maven_args[@]}"
          else
            mvn "${maven_args[@]}"
          fi

      - name: Check the canonical build
        if: matrix.os == inputs['canonical-runner-os'] && matrix.java == inputs['canonical-java-version'] && inputs['validation-command'] != ''
        working-directory: ${{ inputs['maven-working-directory'] }}
        env:
          VALIDATION_COMMAND: ${{ inputs['validation-command'] }}
          MAVEN_SETTINGS: ${{ steps.maven-settings.outputs.path }}
          DEPENDENCY_ARTIFACT_NAME: ${{ inputs['dependency-artifact-name'] }}
        run: bash -e -o pipefail -c "$VALIDATION_COMMAND"

      - name: Collect tested files and POMs
        if: matrix.os == inputs['canonical-runner-os'] && matrix.java == inputs['canonical-java-version']
        working-directory: ${{ inputs['maven-working-directory'] }}
        env:
          ARTIFACTS: ${{ inputs.artifacts }}
          POM_FILE: ${{ inputs['pom-file'] }}
        run: |
          python3 "$GITHUB_WORKSPACE/.ci/hop-plugin-ci/scripts/stage_artifacts.py" \
            --pom "$POM_FILE" --artifacts "$ARTIFACTS" --output "$RUNNER_TEMP/hop-publication"

      - name: Upload canonical artifacts
        if: matrix.os == inputs['canonical-runner-os'] && matrix.java == inputs['canonical-java-version']
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs['artifact-name-prefix'] }}-canonical
          if-no-files-found: error
          path: ${{ runner.temp }}/hop-publication

      - name: Retain test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ inputs['artifact-name-prefix'] }}-${{ matrix.os }}-jdk${{ matrix.java }}
          if-no-files-found: ignore
          path: |
            ${{ inputs['maven-working-directory'] }}/**/target/surefire-reports/
            ${{ inputs['maven-working-directory'] }}/**/target/failsafe-reports/
