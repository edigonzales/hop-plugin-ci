name: Publish verified Maven library

on:
  workflow_call:
    inputs:
      repository-kind:
        required: false
        default: snapshot
        type: string
      verified-artifact-name:
        required: true
        type: string
      artifact-descriptors:
        required: true
        type: string
      pom-file:
        required: true
        type: string
      hop-version:
        required: true
        type: string
      post-publish-commands:
        description: JSON array of commands executed after publication
        required: false
        default: "[]"
        type: string
      ci-ref:
        required: false
        default: main
        type: string
    secrets:
      MAVEN_USERNAME:
        required: true
      MAVEN_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    env:
      MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: edigonzales/hop-plugin-ci
          ref: ${{ inputs['ci-ref'] }}
          path: .ci/hop-plugin-ci
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs['verified-artifact-name'] }}
          path: .ci/library-publish
      - name: Resolve Maven repository
        id: repository
        env:
          KIND: ${{ inputs['repository-kind'] }}
        run: |
          set -euo pipefail
          if [[ "$KIND" != snapshot ]]; then
            echo "Only snapshot publication is supported by this workflow" >&2
            exit 1
          fi
          echo 'id=sogeo-snapshots' >> "$GITHUB_OUTPUT"
          echo 'url=https://jars.interlis.guru/snapshots/' >> "$GITHUB_OUTPUT"
      - name: Set up Maven credentials
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          server-id: ${{ steps.repository.outputs.id }}
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
      - name: Validate canonical bundle
        id: validate
        env:
          ARTIFACTS_JSON: ${{ inputs['artifact-descriptors'] }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          HOP_VERSION: ${{ inputs['hop-version'] }}
          POM_FILE: ${{ inputs['pom-file'] }}
          REPOSITORY_ID: ${{ steps.repository.outputs.id }}
        run: |
          set -euo pipefail
          if [[ -z "$MAVEN_USERNAME" || -z "$MAVEN_PASSWORD" ]]; then
            echo 'Maven deployment credentials are missing' >&2
            exit 1
          fi
          settings="$RUNNER_TEMP/hop-plugin-ci-publish-settings.xml"
          python3 "$GITHUB_WORKSPACE/.ci/hop-plugin-ci/scripts/write_maven_settings.py" \
            --output "$settings" --server-id "$REPOSITORY_ID"
          version="$(mvn -q -s "$settings" -f "$POM_FILE" -DforceStdout help:evaluate -Dexpression=project.version)"
          if [[ "$version" != *-SNAPSHOT ]]; then
            echo "Library publish requires a SNAPSHOT version, found $version" >&2
            exit 1
          fi
          python3 "$GITHUB_WORKSPACE/.ci/hop-plugin-ci/scripts/validate_library_manifest.py" \
            --manifest .ci/library-publish/manifest.json \
            --bundle-dir .ci/library-publish \
            --artifacts-json "$ARTIFACTS_JSON" \
            --repository "$REPOSITORY" \
            --commit-sha "$COMMIT_SHA" \
            --version "$version" \
            --hop-version "$HOP_VERSION"
          echo "settings=$settings" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Publish exact canonical artifacts
        env:
          SETTINGS: ${{ steps.validate.outputs.settings }}
          REPOSITORY_ID: ${{ steps.repository.outputs.id }}
          REPOSITORY_URL: ${{ steps.repository.outputs.url }}
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/.ci/hop-plugin-ci/scripts/deploy_library_artifacts.py" \
            --manifest .ci/library-publish/manifest.json \
            --bundle-dir .ci/library-publish \
            --settings "$SETTINGS" \
            --repository-id "$REPOSITORY_ID" \
            --repository-url "$REPOSITORY_URL"
      - name: Verify public Maven snapshot
        env:
          COMMANDS_JSON: ${{ inputs['post-publish-commands'] }}
        run: |
          python3 "$GITHUB_WORKSPACE/.ci/hop-plugin-ci/scripts/run_commands.py" \
            --commands-json "$COMMANDS_JSON"
